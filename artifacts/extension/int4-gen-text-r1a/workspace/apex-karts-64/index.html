<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Karts 64</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Courier New',monospace}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px;pointer-events:none;z-index:10}
.hb{background:rgba(0,0,0,0.6);border:3px solid #ff6600;border-radius:8px;padding:10px 16px;color:#fff;font-size:14px;text-shadow:1px 1px 0 #000}
.hb .lb{color:#ffaa00;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.hb .vl{font-size:22px;font-weight:bold;margin-top:2px}
#sbc{width:160px;height:14px;background:#333;border-radius:7px;border:2px solid #ff6600;margin-top:6px;overflow:hidden}
#sb{height:100%;width:0%;background:linear-gradient(90deg,#0f0,#ff0,#f40);transition:width 0.1s}
#lap-value{color:#0fa}
#pos-value{color:#f8f}
#timer-value{color:#fc0}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);z-index:20;color:#fff}
#ov.h{display:none}
#ov h1{font-size:48px;color:#f60;text-shadow:3px 3px 0 #a30,6px 6px 0 #510;margin-bottom:8px;letter-spacing:4px}
#ov h2{font-size:28px;color:#fc0;margin-bottom:30px}
.sub{font-size:14px;color:#aaa;margin-bottom:20px}
.ci{font-size:12px;color:#888;margin-top:20px;line-height:1.8}
.ky{display:inline-block;background:#444;border:2px solid #888;border-radius:4px;padding:2px 8px;color:#fff;margin:0 2px}
#cd{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:120px;font-weight:bold;color:#f60;text-shadow:4px 4px 0 #a30,8px 8px 0 #510;z-index:15;pointer-events:none;display:none;font-family:'Courier New'}
.bs{font-family:'Courier New';font-size:20px;padding:14px 40px;background:#f60;color:#fff;border:3px solid #f90;border-radius:8px;cursor:pointer;text-transform:uppercase;letter-spacing:2px;font-weight:bold;box-shadow:0 4px 0 #a30}
.bd{font-family:'Courier New';font-size:14px;padding:8px 20px;background:#369;color:#fff;border:2px solid #48b;border-radius:6px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div id="hud">
  <div class="hb"><div class="lb">Lap</div><div class="vl" id="lap-value">0/1</div></div>
  <div class="hb"><div class="lb">Pos</div><div class="vl" id="pos-value">1/5</div></div>
  <div class="hb"><div class="lb">Speed</div><div class="vl" id="speed-value">0</div><div id="sbc"><div id="sb"></div></div></div>
  <div class="hb"><div class="lb">Time</div><div class="vl" id="timer-value">0:00.0</div></div>
</div>
<div id="cd"></div>
<div id="ov">
  <h1>APEX KARTS 64</h1>
  <h2>Circuit of the Peaks</h2>
  <div class="sub">A Retro Kart Racing Experience</div>
  <button class="bs" id="btn-go">START RACE</button>
  <button class="bd" id="btn-demo">DEMO MODE</button>
  <div class="ci">
    <span class="ky">W</span><span class="ky">↑</span> Accelerate &nbsp;
    <span class="ky">S</span><span class="ky">↓</span> Brake &nbsp;
    <span class="ky">A</span><span class="ky">←</span> Left &nbsp;
    <span class="ky">D</span><span class="ky">→</span> Right &nbsp;
    <span class="ky">SHIFT</span> Boost &nbsp;
    <span class="ky">SPACE</span> Drift
  </div>
</div>
<script type="importmap">
{"imports":{"three":"node_modules/three/build/three.module.js"}}
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
