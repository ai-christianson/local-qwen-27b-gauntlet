<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Karts 64</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace}
canvas{display:block}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;user-select:none}
#hud{display:none;padding:16px 24px}
#hud-top{display:flex;justify-content:space-between;align-items:flex-start}
.hud-box{background:rgba(0,0,0,0.65);border:2px solid #ff6600;border-radius:6px;padding:8px 14px;color:#fff;font-size:14px;line-height:1.5}
.hud-box .label{color:#ff9944;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.hud-box .value{font-size:22px;font-weight:bold;color:#fff}
.hud-box .value.speed{color:#44ff88}
#speed-bar{width:120px;height:10px;background:#333;border-radius:5px;margin-top:4px;overflow:hidden}
#speed-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#44ff88,#ff4444);transition:width 0.1s}
#lap-display{text-align:right}
#time-display{text-align:right}
#pos-display{text-align:center}
#checkmark{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-size:48px;color:#44ff88;opacity:0;transition:opacity 0.3s;text-shadow:0 0 20px #44ff88}
#checkmark.show{opacity:1}
#title-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1a0a2e 0%,#2d1b69 40%,#0f1b3d 100%);display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;z-index:100}
#title-screen h1{font-size:56px;color:#ff6600;text-shadow:3px 3px 0 #330000,0 0 40px #ff660088;letter-spacing:4px;margin-bottom:4px;font-style:italic}
#title-screen .subtitle{font-size:20px;color:#ffaa44;letter-spacing:8px;text-transform:uppercase;margin-bottom:40px}
#title-screen .prompt{font-size:16px;color:#fff;animation:pulse 1.5s ease-in-out infinite}
#title-screen .controls-info{margin-top:30px;color:#8888aa;font-size:12px;text-align:center;line-height:2}
.mode-select{margin-top:20px;display:flex;gap:0}
.mode-btn{color:#aaa;font-size:14px;cursor:pointer;padding:6px 16px;border:2px solid #555;border-radius:4px;transition:all 0.2s;pointer-events:auto}
.mode-btn.active{color:#ff9944;border-color:#ff6600;background:rgba(255,102,0,0.15)}
.mode-btn:first-child{border-radius:4px 0 0 4px}
.mode-btn:last-child{border-radius:0 4px 4px 0}
#results-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;z-index:100}
#results-screen h2{font-size:42px;color:#44ff88;text-shadow:0 0 30px #44ff8888;margin-bottom:20px}
#results-screen .stats{color:#ccc;font-size:16px;line-height:2;text-align:center}
#results-screen .prompt{margin-top:30px;color:#8888aa;font-size:13px;animation:pulse 1.5s ease-in-out infinite}
#countdown{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;color:#ff6600;text-shadow:0 0 40px #ff660088,3px 3px 0 #330000;opacity:0;pointer-events:none}
#minimap{position:absolute;bottom:16px;right:16px;width:140px;height:140px;background:rgba(0,0,0,0.6);border:2px solid #ff660088;border-radius:8px;overflow:hidden;display:none}
#minimap canvas{width:100%;height:100%}
#loading{position:absolute;top:0;left:0;width:100%;height:100%;background:#1a0a2e;display:flex;align-items:center;justify-content:center;color:#ff6600;font-size:24px;z-index:200;transition:opacity 0.5s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>
<div id="loading">Loading...</div>
<div id="title-screen">
  <h1>APEx KARTS</h1>
  <div class="subtitle">64</div>
  <div class="prompt">Press ENTER to Race!</div>
  <div class="mode-select">
    <span class="mode-btn active" id="mode-play" onclick="window.setMode('play')">PLAY</span>
    <span class="mode-btn" id="mode-demo" onclick="window.setMode('demo')">DEMO</span>
  </div>
  <div class="controls-info">
    &uarr; Accelerate &nbsp; &darr; Brake &nbsp; &larr;&rarr; Steer<br>
    SPACE Handbrake &nbsp; ENTER Start
  </div>
</div>
<div id="results-screen">
  <h2>LAP COMPLETE!</h2>
  <div class="stats" id="result-stats"></div>
  <div class="prompt">Press ENTER for another race</div>
</div>
<div id="ui">
  <div id="hud">
    <div id="hud-top">
      <div class="hud-box"><div class="label">Speed</div><div class="value speed" id="speed-val">0</div><div id="speed-bar"><div id="speed-bar-fill"></div></div></div>
      <div class="hud-box" id="pos-display"><div class="label">Position</div><div class="value">1st</div></div>
      <div class="hud-box" id="lap-display"><div class="label">Lap</div><div class="value" id="lap-val">0/1</div></div>
      <div class="hud-box" id="time-display"><div class="label">Time</div><div class="value" id="time-val">0:00.00</div></div>
    </div>
  </div>
  <div id="checkmark">&check;</div>
  <div id="countdown"></div>
  <div id="minimap"><canvas id="minimap-canvas" width="140" height="140"></canvas></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
