<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Karts 64</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud" style="display:none;">
  <div class="pos-display" id="pos-display">1st</div>
  <div class="lap-display" id="lap-display">LAP 1/3</div>
  <div class="time-display" id="time-display">00:00.00</div>
</div>
<div id="overlay">
  <h1>APEX KARTS 64</h1>
  <h2>Grand Prix</h2>
  <div class="subtitle">A Retro Kart Racing Experience</div>
  <div class="controls">
    <strong>Controls:</strong><br>
    Arrow Keys / WASD &mdash; Steer &amp; Accelerate<br>
    SPACE &mdash; Brake / Reverse<br>
    ENTER &mdash; Start / Resume
  </div>
  <button class="btn" id="start-btn">Start Race</button>
  <button class="btn btn-d" id="demo-btn">Demo Mode</button>
</div>
<div id="countdown"></div>
<canvas id="minimap"></canvas>
<div id="demo-badge">DEMO MODE</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
