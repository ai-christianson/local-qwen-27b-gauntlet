<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apex Karts 64</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace}
canvas{display:block}
#ov{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.04) 0px,rgba(0,0,0,0.04) 1px,transparent 1px,transparent 3px)}
#title{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#1a0a2e,#16213e 50%,#0f3460);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center}
#title h1{font-size:60px;color:#FFD700;text-shadow:4px 4px 0 #FF4444,8px 8px 0 #000;letter-spacing:6px;margin-bottom:8px;animation:p 2s ease-in-out infinite}
#title .s{font-size:16px;color:#00FF88;letter-spacing:4px;margin-bottom:50px;text-shadow:2px 2px 0 #000}
@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.mb{background:linear-gradient(180deg,#FF4444,#CC2222);border:3px solid #FFD700;border-radius:12px;color:#FFF;font-size:18px;font-family:'Courier New',monospace;padding:12px 36px;cursor:pointer;margin:6px;text-shadow:2px 2px 0 #000;letter-spacing:2px;transition:transform 0.1s;pointer-events:all}
.mb:hover{transform:scale(1.08);box-shadow:0 0 20px rgba(255,215,0,0.5)}
.ct{color:#888;font-size:11px;margin-top:35px;text-align:center;line-height:1.8}
.ct span{color:#FFD700}
.hb{position:fixed;z-index:50;background:linear-gradient(180deg,rgba(15,15,25,0.92),rgba(5,5,15,0.95));border:2px solid #FFD700;border-radius:8px;padding:10px 18px;color:#FFF;display:none;box-shadow:0 0 12px rgba(255,215,0,0.25),inset 0 1px 0 rgba(255,255,255,0.1)}
.hb .l{font-size:9px;color:#FFD700;letter-spacing:3px;text-transform:uppercase}
.hb .v{font-size:24px;font-weight:bold;letter-spacing:1px;text-shadow:0 0 8px rgba(255,215,0,0.4)}
#hl{top:15px;left:20px}#ht{top:15px;right:20px}
#sw{position:fixed;bottom:20px;right:20px;z-index:50;width:200px;height:24px;background:rgba(0,0,0,0.8);border:2px solid #FFD700;border-radius:4px;overflow:hidden;display:none;box-shadow:0 0 8px rgba(255,215,0,0.2)}
#sf{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#00FF88,#FFD700,#FF4444);transition:width 0.1s ease-out}
#sl{position:fixed;bottom:48px;right:20px;color:#FFD700;font-size:9px;letter-spacing:3px;z-index:50;display:none;text-transform:uppercase}
#lp{position:fixed;bottom:20px;left:20px;width:200px;z-index:50;display:none}
#lbr{width:100%;height:10px;background:rgba(0,0,0,0.8);border:2px solid #FFD700;border-radius:3px;overflow:hidden;box-shadow:0 0 6px rgba(255,215,0,0.15)}
#lf{height:100%;width:0%;background:linear-gradient(90deg,#00FF88,#00CC66);border-radius:2px;transition:width 0.2s ease-out;box-shadow:0 0 8px rgba(0,255,136,0.4)}
#ll{color:#FFD700;font-size:9px;letter-spacing:3px;margin-top:5px;text-align:center;text-transform:uppercase}
#dw{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:50;display:none;color:#FF8800;font-size:16px;letter-spacing:4px;text-shadow:2px 2px 0 #000,0 0 12px rgba(255,136,0,0.6);text-transform:uppercase}
#mc{position:fixed;bottom:60px;right:20px;z-index:50;display:none;width:120px;height:120px;border-radius:50%;border:3px solid #FFD700;box-shadow:0 0 15px rgba(255,215,0,0.3)}
#cd{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:150;font-size:120px;color:#FFD700;text-shadow:6px 6px 0 #FF4444,12px 12px 0 #000,0 0 40px rgba(255,215,0,0.5);display:none;pointer-events:none}
#rs{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.88);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center}
#rs h2{font-size:44px;color:#00FF88;text-shadow:4px 4px 0 #000,0 0 20px rgba(0,255,136,0.4);margin-bottom:20px}
#rs .st{font-size:22px;color:#FFF;margin:8px;text-shadow:1px 1px 0 #000}#rs .st span{color:#FFD700}
</style>
</head>
<body>
<div id="ov"></div>
<div id="title">
<h1>APEX KARTS 64</h1>
<div class="s">CHALLENGER'S CIRCUIT</div>
<button class="mb" onclick="startR(false)">START RACE</button>
<button class="mb" onclick="startR(true)">DEMO MODE</button>
<div class="ct"><span>W/UP</span> Gas <span>S/DN</span> Brake <span>A/LEFT D/RIGHT</span> Steer <span>SPACE</span> Drift <span>R</span> Reset</div>
</div>
<div id="cd"></div>
<div class="hb" id="hl"><div class="l">Lap</div><div class="v" id="vl">0/1</div></div>
<div class="hb" id="ht"><div class="l">Time</div><div class="v" id="vt">0:00.00</div></div>
<div id="sl">Speed</div><div id="sw"><div id="sf"></div></div>
<div id="lp"><div id="lbr"><div id="lf"></div></div><div id="ll">Lap Progress</div></div>
<div id="dw">&laquo; Drift &raquo;</div>
<canvas id="mc"></canvas>
<div id="rs">
<h2>&#x1F3C1; Race Complete!</h2>
<div class="st">Time: <span id="rt">0:00.00</span></div>
<div class="st">Top Speed: <span id="rsp">0</span> km/h</div>
<button class="mb" onclick="doMenu()">Main Menu</button>
<button class="mb" onclick="startR(false)">Replay</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var R=42;
function sr(){R=(R*1664525+1013904223)&0xFFFFFFFF;return(R>>>0)/4294967296}
for(var _i=0;_i<100;_i++)sr();

var GM='title',lap=0,raceTime=0,topSpd=0,cdTimer=0,cdPhase=0,finished=false,startTime=0;
var keys={};
window.addEventListener('keydown',function(e){keys[e.code]=true;e.preventDefault()});
window.addEventListener('keyup',function(e){keys[e.code]=false});

var ren=new THREE.WebGLRenderer({antialias:false});
ren.setSize(window.innerWidth,window.innerHeight);
ren.setPixelRatio(Math.min(window.devicePixelRatio,2));
ren.shadowMap.enabled=true;
ren.shadowMap.type=THREE.PCFSoftShadowMap;
ren.outputEncoding=THREE.sRGBEncoding;
ren.toneMapping=THREE.ACESFilmicToneMapping;
ren.toneMappingExposure=1.1;
document.body.appendChild(ren.domElement);

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x7EC8E3);
scene.fog=new THREE.FogExp2(0x8899AA,0.004);
var cam=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.5,1000);
var clk=new THREE.Clock();

scene.add(new THREE.AmbientLight(0xFFEEDD,0.45));
scene.add(new THREE.HemisphereLight(0x88BBDD,0x557733,0.35));
var sun=new THREE.DirectionalLight(0xFFF5E0,1.1);
sun.position.set(40,80,30);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-80;sun.shadow.camera.right=80;
sun.shadow.camera.top=80;sun.shadow.camera.bottom=-80;
sun.shadow.bias=-0.001;scene.add(sun);
var fillLight=new THREE.DirectionalLight(0xFFCCAA,0.2);
fillLight.position.set(-30,20,-40);scene.add(fillLight);

var TW=[
{x:0,z:0,y:0},{x:20,z:0,y:0},{x:40,z:0,y:0},{x:55,z:5,y:0},
{x:65,z:15,y:.2},{x:68,z:28,y:.3},{x:65,z:40,y:.5},
{x:55,z:48,y:.7},{x:42,z:50,y:1},{x:30,z:48,y:1.5},
{x:20,z:45,y:2},{x:10,z:38,y:2.5},{x:5,z:28,y:2.2},
{x:10,z:18,y:1.8},{x:20,z:12,y:1.2},{x:30,z:8,y:.6},
{x:20,z:5,y:.2},{x:0,z:0,y:0}
];

function cr(p0,p1,p2,p3,t){
var t2=t*t,t3=t2*t;
return{x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3),
z:.5*((2*p1.z)+(-p0.z+p2.z)*t+(2*p0.z-5*p1.z+4*p2.z-p3.z)*t2+(-p0.z+3*p1.z-3*p2.z+p3.z)*t3)};}

var TS=500,TP=[],NT=TW.length;
for(var i=0;i<TS;i++){var t=(i/TS)*(NT-1),ix=Math.floor(t),f=t-ix;
TP.push(cr(TW[Math.max(0,ix-1)%NT],TW[ix%NT],TW[(ix+1)%NT],TW[(ix+2)%NT],f));}
var TN=[];
for(var i=0;i<TP.length;i++){var n=TP[(i+1)%TP.length];
var dx=n.x-TP[i].x,dz=n.z-TP[i].z,l=Math.sqrt(dx*dx+dz*dz)||1;
TN.push({x:-dz/l,z:dz/l});}
var TW2=12;

function roadTex(){
var c=document.createElement('canvas');c.width=256;c.height=512;
var ctx=c.getContext('2d');
ctx.fillStyle='#4A4A4A';ctx.fillRect(0,0,256,512);
for(var i=0;i<5000;i++){var b=55+Math.floor(sr()*35);
ctx.fillStyle='rgb('+b+','+b+','+(b+5)+')';ctx.fillRect(Math.random()*256,Math.random()*512,1+Math.random()*2,1+Math.random()*2);}
for(var i=0;i<200;i++){ctx.fillStyle='rgba(30,30,30,0.3)';ctx.fillRect(100+sr()*56,Math.random()*512,2+sr()*4,1+sr()*2);}
ctx.strokeStyle='#FFF';ctx.lineWidth=3;ctx.setLineDash([18,22]);
ctx.beginPath();ctx.moveTo(128,0);ctx.lineTo(128,512);ctx.stroke();
ctx.setLineDash([]);ctx.lineWidth=2;ctx.strokeStyle='#CCC';
ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(18,512);ctx.stroke();
ctx.beginPath();ctx.moveTo(238,0);ctx.lineTo(238,512);ctx.stroke();
var tex=new THREE.CanvasTexture(c);tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;
tex.repeat.set(1,20);tex.minFilter=THREE.LinearMipmapLinearFilter;tex.magFilter=THREE.LinearFilter;return tex;}

function buildTrack(){
var hw=TW2/2,verts=[],idx=[];
for(var i=0;i<TP.length;i++){var p=TP[i],n=TN[i];
verts.push(p.x+n.x*hw,p.y,p.z+n.z*hw,p.x-n.x*hw,p.y,p.z-n.z*hw);}
for(var i=0;i<TP.length;i++){var i2=i*2,nx=((i+1)%TP.length)*2;
idx.push(i2,nx,i2+1,i2+1,nx,nx+1);}
var geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
geo.setIndex(idx);geo.computeVertexNormals();
var mat=new THREE.MeshPhongMaterial({map:roadTex(),color:0x808080,specular:0x222222,shininess:8});
var mesh=new THREE.Mesh(geo,mat);mesh.receiveShadow=true;scene.add(mesh);

for(var i=0;i<TP.length;i+=3){var p=TP[i],n=TN[i],side=Math.floor(i/3)%2===0;
var cMat=new THREE.MeshPhongMaterial({color:side?0xCC2222:0xDDDDDD,specular:0x333333,shininess:5});
var cg=new THREE.BoxGeometry(.4,.08,2.2);
var ml=new THREE.Mesh(cg,cMat);ml.position.set(p.x+n.x*(hw+.5),p.y+.04,p.z+n.z*(hw+.5));ml.rotation.y=Math.atan2(n.x,n.z);ml.receiveShadow=true;scene.add(ml);
var mr=new THREE.Mesh(cg,cMat);mr.position.set(p.x-n.x*(hw+.5),p.y+.04,p.z-n.z*(hw+.5));mr.rotation.y=Math.atan2(-n.x,-n.z);mr.receiveShadow=true;scene.add(mr);}

for(var i=0;i<TP.length;i+=5){var p=TP[i],n=TN[i];
var bright=.4+sr()*.15;
var gMat=new THREE.MeshPhongMaterial({color:new THREE.Color(bright,bright,bright+0.05),specular:0x555555,shininess:25});
var bg=new THREE.BoxGeometry(.15,.6,2.8);
var bl=new THREE.Mesh(bg,gMat);bl.position.set(p.x+n.x*(hw+1.5),p.y+.3,p.z+n.z*(hw+1.5));bl.rotation.y=Math.atan2(n.x,n.z);bl.castShadow=true;bl.receiveShadow=true;scene.add(bl);
var br=new THREE.Mesh(bg,gMat);br.position.set(p.x-n.x*(hw+1.5),p.y+.3,p.z-n.z*(hw+1.5));br.rotation.y=Math.atan2(-n.x,-n.z);br.castShadow=true;br.receiveShadow=true;scene.add(br);
if(i%15<5){var postMat=new THREE.MeshPhongMaterial({color:0x666666,specular:0x444444,shininess:20});
var pg=new THREE.CylinderGeometry(.06,.08,.65,5);
var pl=new THREE.Mesh(pg,postMat);pl.position.set(p.x+n.x*(hw+1.5),p.y+.32,p.z+n.z*(hw+1.5));pl.castShadow=true;scene.add(pl);
var pr=new THREE.Mesh(pg,postMat);pr.position.set(p.x-n.x*(hw+1.5),p.y+.32,p.z-n.z*(hw+1.5));pr.castShadow=true;scene.add(pr);}}
}

function buildSF(){
var p=TP[0],n=TN[0];
var c=document.createElement('canvas');c.width=128;c.height=128;var ctx=c.getContext('2d');
for(var r=0;r<8;r++)for(var co=0;co<8;co++){ctx.fillStyle=(r+co)%2===0?'#FFF':'#111';ctx.fillRect(co*16,r*16,16,16);}
var tex=new THREE.CanvasTexture(c);
var mesh=new THREE.Mesh(new THREE.PlaneGeometry(TW2-.5,2.5),new THREE.MeshPhongMaterial({map:tex,color:0xFFFFFF,specular:0x222222,shininess:5}));
mesh.rotation.x=-Math.PI/2;mesh.position.set(p.x,p.y+.06,p.z);mesh.rotation.z=-Math.atan2(n.x,n.z);scene.add(mesh);
var pg=new THREE.BoxGeometry(.4,4,.4);
var pm=new THREE.MeshPhongMaterial({color:0xFFD700,specular:0xFFFFAA,shininess:40});
var pl=new THREE.Mesh(pg,pm);pl.position.set(p.x+n.x*(TW2/2+.3),p.y+2,p.z+n.z*(TW2/2+.3));pl.castShadow=true;scene.add(pl);
var pr=new THREE.Mesh(pg,pm);pr.position.set(p.x-n.x*(TW2/2+.3),p.y+2,p.z-n.z*(TW2/2+.3));pr.castShadow=true;scene.add(pr);
var bb=new THREE.Mesh(new THREE.BoxGeometry(TW2+1,.3,.3),new THREE.MeshPhongMaterial({color:0xFF4444,specular:0x662222,shininess:20}));
bb.position.set(p.x,p.y+4.2,p.z);bb.rotation.y=Math.atan2(n.x,n.z);bb.castShadow=true;scene.add(bb);}

function buildTerrain(){
var tg=new THREE.PlaneGeometry(400,400,80,80);var pos=tg.attributes.position.array;
var colors=new Float32Array(pos.length);
for(var i=0;i<pos.length;i+=3){
var h=-1+Math.sin(pos[i]*.05)*2+Math.cos(pos[i+1]*.07)*1.5;
var d=Math.sqrt(pos[i]*pos[i]+pos[i+1]*pos[i+1]);if(d>60)h+=(d-60)*.03;pos[i+2]=h;
var dist=Math.min(1,d/80),gn=Math.sin(pos[i]*.1)*.05+Math.cos(pos[i+1]*.12)*.05;
colors[i]=Math.max(0.12,0.18+dist*.1+gn);colors[i+1]=Math.max(0.25,0.52+gn*2+dist*.05);
colors[i+2]=Math.max(0.08,0.12+dist*.08);}
tg.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));tg.computeVertexNormals();
var t=new THREE.Mesh(tg,new THREE.MeshPhongMaterial({vertexColors:THREE.VertexColors,specular:0x111111,shininess:3}));
t.rotation.x=-Math.PI/2;t.position.y=0;t.receiveShadow=true;scene.add(t);}

function buildTrees(){
var tg=new THREE.CylinderGeometry(.25,.4,2,6);
var tm=new THREE.MeshPhongMaterial({color:0x8B6914,specular:0x222222,shininess:5});
var cg=new THREE.ConeGeometry(2,4,6);var cs=[0x228B22,0x2E8B2E,0x1B7A1B,0x1D6B1D];
for(var i=0;i<60;i++){var a=sr()*Math.PI*2,d=25+sr()*80,tx=Math.cos(a)*d,tz=Math.sin(a)*d,on=false;
for(var j=0;j<TP.length;j+=15){if((tx-TP[j].x)*(tx-TP[j].x)+(tz-TP[j].z)*(tz-TP[j].z)<200){on=true;break;}}
if(on)continue;var g=new THREE.Group();var s=.7+sr()*.6;
var tr=new THREE.Mesh(tg,tm);tr.position.y=1;tr.scale.set(s,s,s);tr.castShadow=true;g.add(tr);
var cn=new THREE.Mesh(cg,new THREE.MeshPhongMaterial({color:cs[Math.floor(sr()*4)],specular:0x111111,shininess:3}));
cn.position.y=4;cn.scale.set(s,s*.8+s*.3,s);cn.castShadow=true;g.add(cn);
g.position.set(tx,-1,tz);g.rotation.y=sr()*Math.PI*2;scene.add(g);}}

function buildClouds(){
for(var i=0;i<12;i++){var g=new THREE.Group(),np=3+Math.floor(sr()*4);
var cg=new THREE.SphereGeometry(3+sr()*4,6,4);
var cm=new THREE.MeshPhongMaterial({color:0xFFFFFF,transparent:true,opacity:.65,specular:0x444444,shininess:5});
for(var j=0;j<np;j++){var p=new THREE.Mesh(cg,cm);p.position.set((sr()-.5)*8,(sr()-.5)*2,(sr()-.5)*5);p.scale.y=.4;g.add(p);}
g.position.set((sr()-.5)*200,40+sr()*20,(sr()-.5)*200);scene.add(g);}}

var NCP=4,CPS=[];
for(var i=0;i<NCP;i++){var idx=Math.floor((i/NCP)*TP.length);CPS.push({idx:idx,x:TP[idx].x,z:TP[idx].z,passed:false});}

var kart,kw=[];
function buildKart(){
kart=new THREE.Group();
var bodyMat=new THREE.MeshPhongMaterial({color:0xDD2222,specular:0xFF6644,shininess:40});
var darkMat=new THREE.MeshPhongMaterial({color:0x333333,specular:0x555555,shininess:30});
var metalMat=new THREE.MeshPhongMaterial({color:0xAAAAAA,specular:0xDDDDDD,shininess:50});
var tireMat=new THREE.MeshPhongMaterial({color:0x222222,specular:0x111111,shininess:5});
var b=new THREE.Mesh(new THREE.BoxGeometry(1.4,.7,2.2),bodyMat);b.position.y=.65;b.castShadow=true;kart.add(b);
var ns=new THREE.Mesh(new THREE.BoxGeometry(.9,.4,.8),new THREE.MeshPhongMaterial({color:0xFF3333,specular:0xFF6644,shininess:35}));
ns.position.set(0,.6,-1.3);ns.rotation.x=.15;ns.castShadow=true;kart.add(ns);
var wMat=new THREE.MeshPhongMaterial({color:0xFF6600,specular:0xFF8844,shininess:30});
var w=new THREE.Mesh(new THREE.BoxGeometry(1.8,.12,.35),wMat);w.position.set(0,1.45,.95);w.castShadow=true;kart.add(w);
for(var s=-1;s<=1;s+=2){var ep=new THREE.Mesh(new THREE.BoxGeometry(.08,.35,.35),wMat);ep.position.set(s*.94,1.45,.95);kart.add(ep);}
for(var s=-1;s<=1;s+=2){var st=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.5,5),metalMat);st.position.set(s*.6,1.2,.95);kart.add(st);}
var se=new THREE.Mesh(new THREE.BoxGeometry(.85,.25,.7),darkMat);se.position.set(0,.92,.2);kart.add(se);
var br=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.9,6),metalMat);br.rotation.z=Math.PI/2;br.position.set(0,1.08,-.5);kart.add(br);
var sw=new THREE.Mesh(new THREE.TorusGeometry(.12,.025,4,6),darkMat);sw.position.set(0,1.08,-.5);kart.add(sw);
var wGeo=new THREE.CylinderGeometry(.35,.35,.3,8);
[{x:-.85,z:.7},{x:.85,z:.7},{x:-.85,z:-.7},{x:.85,z:-.7}].forEach(function(p){
var wg=new THREE.Group();wg.position.set(p.x,.35,p.z);
var wh=new THREE.Mesh(wGeo,tireMat);wh.rotation.x=Math.PI/2;wh.castShadow=true;wg.add(wh);
var tread=new THREE.Mesh(new THREE.CylinderGeometry(.37,.37,.08,8),new THREE.MeshPhongMaterial({color:0x1A1A1A,specular:0x050505,shininess:3}));
tread.rotation.x=Math.PI/2;tread.position.z=.12;wg.add(tread);
var hub=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.32,6),metalMat);hub.rotation.x=Math.PI/2;wg.add(hub);
kart.add(wg);kw.push(wg);});
for(var s=-1;s<=1;s+=2){var pipe=new THREE.Mesh(new THREE.CylinderGeometry(.06,.1,.5,6),metalMat);pipe.rotation.x=Math.PI/2;pipe.position.set(s*.45,.3,1.5);kart.add(pipe);}
scene.add(kart);}

// === PARTICLE SYSTEMS ===
var sparkMax=200,exhaustMax=80;
var sP=new Float32Array(sparkMax*3),sV=new Float32Array(sparkMax*3),sL=new Float32Array(sparkMax),sC=new Float32Array(sparkMax*3);
var sGeo=new THREE.BufferGeometry();sGeo.setAttribute('position',new THREE.Float32BufferAttribute(sP,3));sGeo.setAttribute('color',new THREE.Float32BufferAttribute(sC,3));sGeo.setDrawRange(0,0);
var sPts=new THREE.Points(sGeo,new THREE.PointsMaterial({size:.15,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}));
sPts.frustumCulled=false;scene.add(sPts);
var eP=new Float32Array(exhaustMax*3),eV=new Float32Array(exhaustMax*3),eL=new Float32Array(exhaustMax),eC=new Float32Array(exhaustMax*3);
var eGeo=new THREE.BufferGeometry();eGeo.setAttribute('position',new THREE.Float32BufferAttribute(eP,3));eGeo.setAttribute('color',new THREE.Float32BufferAttribute(eC,3));eGeo.setDrawRange(0,0);
