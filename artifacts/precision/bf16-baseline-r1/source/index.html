<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Karts 64</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Courier New',monospace}
canvas{display:block}
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#speed-container{position:absolute;bottom:24px;right:24px;width:220px;height:28px;border:3px solid #fff;border-radius:4px;background:rgba(0,0,0,0.5)}
#speed-bar{height:100%;width:0%;background:linear-gradient(90deg,#0f0,#ff0,#f40);border-radius:2px;transition:width .05s}
#speed-text{position:absolute;top:-22px;right:0;color:#fff;font-size:14px;font-weight:bold;text-shadow:2px 2px #000}
#lap-info{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:20px;font-weight:bold;text-shadow:2px 2px 4px #000;background:rgba(0,0,0,0.5);padding:8px 20px;border-radius:6px}
#timer{font-size:24px;color:#ff0}
#minimap-container{position:absolute;bottom:24px;left:24px;border:3px solid rgba(255,255,255,0.6);border-radius:6px;background:rgba(0,0,0,0.5);width:140px;height:140px}
#minimap{width:100%;height:100%}
#start-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#1a0a2e,#2d1b69);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff}
#start-screen h1{font-size:52px;color:#ff6600;text-shadow:3px 3px #800,-1px -1px #fa0;margin-bottom:8px}
#start-screen .sub{font-size:18px;color:#fc0;margin-bottom:40px}
#start-screen .prompt{font-size:20px;color:#afa;animation:blink 1s infinite}
#start-screen .ctrl{margin-top:30px;font-size:13px;color:#aaa;text-align:center;line-height:1.8}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#finish-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff}
#finish-screen h2{font-size:42px;color:#fc0;margin-bottom:10px}
#finish-screen .ft{font-size:28px;color:#0f0;margin:10px 0}
#finish-screen .prompt{font-size:16px;color:#afa;margin-top:30px;animation:blink 1s infinite}
#countdown{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:96px;color:#fff;text-shadow:4px 4px #f00;z-index:90;display:none;font-weight:bold}
#demo-badge{position:absolute;top:16px;left:16px;color:#f44;font-size:14px;font-weight:bold;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:4px;display:none}
</style>
</head>
<body>
<div id="start-screen">
  <h1>APEX KARTS 64</h1>
  <div class="sub">~ Blistering Badlands ~</div>
  <div class="prompt">Press ENTER to Start</div>
  <div class="ctrl">W/Up=Gas S/Dn=Brake A/D=Steer F=Demo</div>
</div>
<div id="finish-screen">
  <h2>FINISH!</h2>
  <div class="ft" id="final-time">00:00.000</div>
  <div class="prompt">Press ENTER to Race Again</div>
</div>
<div id="countdown"></div>
<div id="hud">
  <div id="lap-info">LAP <span id="lap-num">1</span>/1 | <span id="timer">00:00.000</span></div>
  <div id="speed-container"><div id="speed-text">0 km/h</div><div id="speed-bar"></div></div>
  <div id="minimap-container"><canvas id="minimap" width="140" height="140"></canvas></div>
  <div id="demo-badge">DEMO MODE</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
