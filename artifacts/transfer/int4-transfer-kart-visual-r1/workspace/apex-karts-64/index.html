<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apex Karts 64</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',Tahoma,sans-serif}
canvas{display:block}
#hud{position:absolute;top:0;left:0;width:100%;pointer-events:none;display:flex;justify-content:space-between;padding:16px 24px}
.hud-box{background:rgba(0,0,0,0.6);border-radius:12px;padding:10px 18px;color:#fff;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(4px)}
.hl{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:#ffd700;margin-bottom:2px;font-weight:600}
.hv{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
#sb{width:180px;height:12px;background:rgba(255,255,255,0.12);border-radius:6px;margin-top:6px;overflow:hidden;border:1px solid rgba(255,255,255,0.06)}
#sf{height:100%;border-radius:5px;width:0%}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:52px;font-weight:900;color:#fff;text-shadow:3px 3px 0 #d32f2f,-2px -2px 0 #1565c0,0 0 30px rgba(255,255,255,0.3);opacity:0;transition:opacity 0.4s;pointer-events:none;text-align:center;letter-spacing:2px}
#msg.show{opacity:1}
#cd{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:130px;font-weight:900;color:#fff;text-shadow:4px 4px 0 #d32f2f,0 0 40px rgba(255,215,0,0.5);opacity:0;pointer-events:none;letter-spacing:4px}
#cp{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);border-radius:10px;padding:8px 20px;color:#ccc;font-size:12px;pointer-events:none;display:flex;gap:20px;border:1px solid rgba(255,255,255,0.08)}
.k{display:inline-block;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:4px;padding:1px 7px;font-family:monospace;color:#fff;font-size:11px}
#bb{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.btn{color:#fff;border:none;border-radius:8px;padding:8px 22px;font-size:14px;font-weight:700;cursor:pointer;pointer-events:all;letter-spacing:1px;text-transform:uppercase;box-shadow:0 3px 0 rgba(0,0,0,0.4),0 4px 12px rgba(0,0,0,0.4);transition:transform 0.1s,box-shadow 0.1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,0.4),0 2px 6px rgba(0,0,0,0.4)}
.btn:disabled{opacity:0.5;cursor:default;transform:none}
.bs{background:linear-gradient(180deg,#ff7043,#d84315)}
.bd{background:linear-gradient(180deg,#42a5f5,#1565c0)}
.br{background:linear-gradient(180deg,#66bb6a,#2e7d32)}
#lapBar{position:absolute;top:82px;right:24px;pointer-events:none}
#lapBarInner{display:flex;gap:6px}
.lp{width:28px;height:6px;background:rgba(255,255,255,0.15);border-radius:3px;border:1px solid rgba(255,255,255,0.08)}
.lp.done{background:linear-gradient(90deg,#4caf50,#8bc34a)}
</style>
</head>
<body>
<div id="hud">
  <div class="hud-box"><div class="hl">Speed</div><div class="hv" id="sv">0 <span style="font-size:14px">km/h</span></div><div id="sb"><div id="sf"></div></div></div>
  <div class="hud-box" style="text-align:right"><div class="hl">Time</div><div class="hv" id="tv">00:00.00</div><div class="hl">Lap</div><div class="hv" id="lv">0 / 1</div></div>
</div>
<div id="lapBar"><div id="lapBarInner">
  <div class="lp" id="lp0"></div><div class="lp" id="lp1"></div><div class="lp" id="lp2"></div><div class="lp" id="lp3"></div>
</div></div>
<div id="bb">
  <button class="btn bs" id="bst">START</button>
  <button class="btn bd" id="bde">DEMO</button>
  <button class="btn br" id="bre">RESET</button>
</div>
<div id="msg"></div>
<div id="cd"></div>
<div id="cp">
  <span><span class="k">W</span><span class="k">S</span> Accel/Brake</span>
  <span><span class="k">A</span><span class="k">D</span> Steer</span>
  <span><span class="k">SPACE</span> Handbrake</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
